<title>Zehra Yılmaz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html { background:#0b0b0c; }
  body {
    background:#0b0b0c;
    color:#f2f1ee;
    font-family:'Poppins',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 18px 56px;
  }
  .page { width:100%; max-width:400px; }

  .brand {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding-bottom:28px;
  }
  .brand img { display:block; width:auto; }
  .brand-logo--zcy { height:38px; }
  .brand-logo--vanucci { height:30px; border-radius:3px; }
  .brand-divider { width:1px; height:26px; background:rgba(255,255,255,0.22); }

  .identity {
    text-align:center;
    padding-bottom:30px;
  }
  .identity h1 {
    font-family:'Lora',serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:0.01em;
    text-wrap:balance;
  }
  .identity p {
    font-family:'Poppins',sans-serif;
    font-size:11.5px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:#a9a29b;
    margin-top:6px;
  }

  .contact-list {
    display:flex;
    flex-direction:column;
    border-top:1px solid rgba(255,255,255,0.14);
  }
  .row {
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 4px;
    border-bottom:1px solid rgba(255,255,255,0.14);
    text-decoration:none;
    color:inherit;
    transition:background-color .15s ease;
  }
  .row:active { background-color:rgba(255,255,255,0.05); }
  .row .icon {
    flex:0 0 auto;
    width:19px; height:19px;
    color:#c9a24b;
  }
  .row .icon svg { width:100%; height:100%; }
  .row-text { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .row-text .label {
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#8f8880;
  }
  .row-text .value {
    font-size:15px;
    color:#f2f1ee;
    font-variant-numeric: tabular-nums;
    line-height:1.35;
  }
  .row .chev {
    flex:0 0 auto;
    width:15px; height:15px;
    color:#5b5650;
  }

  .partners {
    margin-top:38px;
    text-align:center;
  }
  .partners-label {
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#8f8880;
    margin-bottom:16px;
  }
  .partner-tile {
    display:inline-flex;
    padding:9px 18px;
    background:#141416;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:4px;
  }
  .partner-tile img { height:22px; display:block; }

  .foot {
    text-align:center;
    margin-top:40px;
    font-size:10.5px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:#5b5650;
  }
</style>
