<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takvimim</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#1a1a2e;
  --bg1:#1f1f35;
  --bg2:#252540;
  --bg3:#2a2a4a;
  --border:#32325a;
  --accent:#9b8fce;
  --accent2:#7ec8a4;
  --text1:#dcd8f0;
  --text2:#9b97b8;
  --text3:#6a6785;
  --danger:#c97a7a;
  --success:#7ead82;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg0);color:var(--text1)}

/* EKRANLAR */
.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}

/* KİLİT / KURULUM ORTAK */
.center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{background:var(--bg1);border:0.5px solid var(--border);border-radius:20px;padding:40px 32px;width:100%;max-width:340px;text-align:center}
.auth-icon{font-size:36px;color:var(--accent);margin-bottom:16px;opacity:.9}
.auth-icon.green{color:var(--accent2)}
.auth-title{font-size:19px;font-weight:500;color:var(--text1);margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--text3);margin-bottom:28px;line-height:1.7}
.auth-err{font-size:12px;color:var(--danger);min-height:18px;margin-bottom:10px}
.f-group{margin-bottom:14px;text-align:left}
.f-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block}
.f-input{width:100%;background:var(--bg0);border:0.5px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text1);font-size:14px;outline:none;font-family:inherit;transition:border-color .2s}
.f-input:focus{border-color:var(--accent)}
.f-input.center{text-align:center;letter-spacing:4px;font-size:15px}
.auth-btn{width:100%;background:var(--accent);border:none;color:#fff;padding:13px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;transition:opacity .2s;margin-bottom:14px;letter-spacing:.3px}
.auth-btn:hover{opacity:.85}
.text-btn{font-size:11px;color:var(--text3);cursor:pointer;background:none;border:none;padding:0;transition:color .2s}
.text-btn:hover{color:var(--text2)}

/* UYGULAMA */
.app-wrap{display:flex;flex-direction:column;height:100vh;background:var(--bg0)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:var(--bg1);border-bottom:0.5px solid var(--border);flex-shrink:0}
.nav-btns{display:flex;gap:6px}
.icon-btn{background:transparent;border:0.5px solid var(--border);color:var(--text2);width:34px;height:34px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0}
.icon-btn:hover{background:var(--bg2);color:var(--text1)}
.icon-btn.danger:hover{color:var(--danger);border-color:var(--danger)}
.month-label{font-size:15px;font-weight:500;color:var(--text1);min-width:160px;text-align:center;letter-spacing:.2px}
.topbar-right{display:flex;gap:8px;align-items:center}
.add-btn{background:var(--accent);border:none;color:#fff;padding:9px 16px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;transition:opacity .2s}
.add-btn:hover{opacity:.85}

/* TAKVİM */
.main{display:flex;flex:1;overflow:hidden}
.cal-col{flex:1;display:flex;flex-direction:column;overflow:hidden}
.days-header{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg1);border-bottom:0.5px solid var(--border);padding:0 10px}
.day-hdr{text-align:center;padding:8px 4px;font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);flex:1;padding:10px;gap:5px;overflow:hidden}
.cal-day{background:var(--bg1);border:0.5px solid var(--border);border-radius:10px;padding:7px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.cal-day:hover{background:var(--bg2);border-color:var(--accent)}
.cal-day.today{border-color:var(--accent);background:var(--bg2)}
.cal-day.today .day-num{color:var(--accent);font-weight:600}
.cal-day.other-month{opacity:.22}
.cal-day.selected{border-color:var(--accent2);background:var(--bg2)}
.day-num{font-size:12px;color:var(--text2);margin-bottom:3px;flex-shrink:0}
.ev-dot{font-size:10px;line-height:1.35;color:var(--text1);background:var(--bg3);border-left:2px solid var(--accent);padding:2px 5px;border-radius:0 4px 4px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-bottom:2px;flex-shrink:0}
.ev-dot.todo{border-color:var(--accent2)}
.ev-dot.urgent{border-color:var(--danger)}
.ev-dot.done{border-color:var(--text3);color:var(--text3);text-decoration:line-through}

/* YAN PANEL */
.side-panel{width:280px;background:var(--bg1);border-left:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.panel-hdr{padding:18px 16px 13px;border-bottom:0.5px solid var(--border);flex-shrink:0}
.panel-date{font-size:14px;font-weight:500;color:var(--text1)}
.panel-sub{font-size:12px;color:var(--text3);margin-top:3px}
.events-list{flex:1;overflow-y:auto;padding:12px}
.events-list::-webkit-scrollbar{width:3px}
.events-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ev-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;transition:border-color .2s}
.ev-card:hover{border-color:var(--accent)}
.ev-card.done-card{opacity:.5}
.ec-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ec-title{font-size:13px;font-weight:500;color:var(--text1);flex:1;line-height:1.4}
.ec-title.done-txt{text-decoration:line-through;color:var(--text3)}
.ec-badge{font-size:10px;padding:2px 7px;border-radius:5px;flex-shrink:0}
.badge-plan{background:rgba(155,143,206,.13);color:var(--accent)}
.badge-todo{background:rgba(126,200,164,.13);color:var(--accent2)}
.badge-urgent{background:rgba(201,122,122,.13);color:var(--danger)}
.ec-time{font-size:11px;color:var(--text3);margin-top:4px}
.ec-desc{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.6}
.ec-actions{display:flex;gap:6px;margin-top:9px}
.ec-btn{font-size:11px;padding:4px 9px;border-radius:6px;border:0.5px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .2s}
.ec-btn:hover{background:var(--bg3);color:var(--text1)}
.ec-btn.ok-btn{color:var(--accent2)}
.ec-btn.del-btn:hover{color:var(--danger);border-color:var(--danger)}
.panel-bottom{padding:12px;border-top:0.5px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:8px;align-items:center}
.panel-add-btn{width:100%;background:var(--bg2);border:0.5px dashed var(--border);color:var(--text3);padding:10px;border-radius:10px;cursor:pointer;font-size:13px;transition:all .2s}
.panel-add-btn:hover{border-color:var(--accent);color:var(--accent)}
.empty-state{text-align:center;padding:30px 16px;color:var(--text3);font-size:12px;line-height:2}
.empty-icon{font-size:28px;margin-bottom:8px;opacity:.3}

/* MODALler */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,20,.72);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(3px)}
.modal{background:var(--bg1);border:0.5px solid var(--border);border-radius:16px;padding:24px;width:340px;max-width:94vw}
.modal h3{font-size:15px;font-weight:500;color:var(--text1);margin-bottom:18px}
.m-group{margin-bottom:13px}
.m-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block}
.m-input{width:100%;background:var(--bg0);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text1);font-size:13px;outline:none;font-family:inherit;transition:border-color .2s}
.m-input:focus{border-color:var(--accent)}
.m-select{width:100%;background:var(--bg0);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text1);font-size:13px;outline:none;font-family:inherit}
.m-textarea{width:100%;background:var(--bg0);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text1);font-size:13px;outline:none;font-family:inherit;resize:vertical;min-height:75px;line-height:1.6}
.m-textarea:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn-cancel{background:transparent;border:0.5px solid var(--border);color:var(--text2);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.btn-cancel:hover{background:var(--bg2)}
.btn-save{background:var(--accent);border:none;color:#fff;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:opacity .2s}
.btn-save:hover{opacity:.85}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* MOBİL */
@media(max-width:600px){
  .side-panel{display:none}
  .topbar{padding:10px 14px}
  .month-label{min-width:120px;font-size:14px}
  .cal-grid{padding:6px;gap:3px}
  .cal-day{padding:4px;border-radius:8px}
  .day-num{font-size:11px}
  .ev-dot{font-size:9px}
  .add-btn span{display:none}
}
</style>
</head>
<body>

<!-- KURULUM -->
<div class="screen" id="screen-setup">
  <div class="center-wrap">
    <div class="auth-card">
      <div class="auth-icon green"><i class="ti ti-shield-lock"></i></div>
      <div class="auth-title">Takvimine hoş geldin</div>
      <div class="auth-sub">Kişisel takvimine bir şifre belirle.<br>Sadece sen girebileceksin.</div>
      <div class="auth-err" id="setup-err"></div>
      <div class="f-group">
        <label class="f-label">Şifre</label>
        <input class="f-input" type="password" id="setup-pw" placeholder="En az 4 karakter..." autocomplete="new-password">
      </div>
      <div class="f-group">
        <label class="f-label">Şifre tekrar</label>
        <input class="f-input" type="password" id="setup-pw2" placeholder="Tekrar gir..." autocomplete="new-password">
      </div>
      <button class="auth-btn" onclick="doSetup()">Başla</button>
    </div>
  </div>
</div>

<!-- KİLİT -->
<div class="screen" id="screen-lock">
  <div class="center-wrap">
    <div class="auth-card">
      <div class="auth-icon"><i class="ti ti-lock"></i></div>
      <div class="auth-title">Takvimine hoş geldin</div>
      <div class="auth-sub">Planlarını görmek için<br>şifreni gir.</div>
      <div class="auth-err" id="lock-err"></div>
      <input class="f-input center" type="password" id="lock-pw" placeholder="••••••••" autocomplete="current-password" style="margin-bottom:12px">
      <button class="auth-btn" onclick="doUnlock()">Giriş</button>
      <button class="text-btn" onclick="resetAll()">Şifremi sıfırla (tüm veriler silinir)</button>
    </div>
  </div>
</div>

<!-- UYGULAMA -->
<div class="screen" id="screen-app">
  <div class="app-wrap">
    <div class="topbar">
      <div class="nav-btns">
        <button class="icon-btn" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
        <button class="icon-btn" onclick="goToday()"><i class="ti ti-calendar"></i></button>
        <button class="icon-btn" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="month-label" id="month-label"></div>
      <div class="topbar-right">
        <button class="add-btn" onclick="openModal()">
          <i class="ti ti-plus"></i><span>Yeni Plan</span>
        </button>
        <button class="icon-btn danger" title="Kilitle" onclick="lockApp()"><i class="ti ti-lock"></i></button>
      </div>
    </div>

    <div class="main">
      <div class="cal-col">
        <div class="days-header">
          <div class="day-hdr">Pzt</div>
          <div class="day-hdr">Sal</div>
          <div class="day-hdr">Çar</div>
          <div class="day-hdr">Per</div>
          <div class="day-hdr">Cum</div>
          <div class="day-hdr" style="color:var(--accent)">Cmt</div>
          <div class="day-hdr" style="color:var(--accent)">Paz</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <div class="side-panel">
        <div class="panel-hdr">
          <div class="panel-date" id="panel-date">Bir gün seç</div>
          <div class="panel-sub" id="panel-sub">Planlarını görüntüle</div>
        </div>
        <div class="events-list" id="events-list">
          <div class="empty-state">
            <div class="empty-icon"><i class="ti ti-calendar-event"></i></div>
            Bir güne tıklayarak<br>planlarını görüntüle
          </div>
        </div>
        <div class="panel-bottom">
          <button class="panel-add-btn" onclick="openModalForSelected()">+ Bu güne plan ekle</button>
          <button class="text-btn" onclick="openChangePw()">Şifremi değiştir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PLAN EKLE MODALİ -->
  <div class="modal-overlay" id="modal" style="display:none">
    <div class="modal">
      <h3>Yeni Plan</h3>
      <div class="m-group">
        <label class="m-label">Başlık *</label>
        <input class="m-input" id="f-title" placeholder="Ne planladın?">
      </div>
      <div class="two-col">
        <div class="m-group">
          <label class="m-label">Tarih *</label>
          <input class="m-input" id="f-date" type="date">
        </div>
        <div class="m-group">
          <label class="m-label">Saat</label>
          <input class="m-input" id="f-time" type="time">
        </div>
      </div>
      <div class="m-group">
        <label class="m-label">Tür</label>
        <select class="m-select" id="f-type">
          <option value="plan">📌 Plan</option>
          <option value="todo">✅ Yapılacak</option>
          <option value="urgent">🔴 Acil</option>
        </select>
      </div>
      <div class="m-group">
        <label class="m-label">Açıklama / Not</label>
        <textarea class="m-textarea" id="f-desc" placeholder="Detaylar, hatırlatmalar..."></textarea>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">İptal</button>
        <button class="btn-save" onclick="saveEvent()">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- ŞİFRE DEĞİŞTİR MODALİ -->
  <div class="modal-overlay" id="chg-modal" style="display:none">
    <div class="modal">
      <h3>Şifremi Değiştir</h3>
      <div class="auth-err" id="chg-err"></div>
      <div class="m-group"><label class="m-label">Mevcut şifre</label><input class="m-input" type="password" id="chg-old"></div>
      <div class="m-group"><label class="m-label">Yeni şifre</label><input class="m-input" type="password" id="chg-new"></div>
      <div class="m-group"><label class="m-label">Yeni şifre tekrar</label><input class="m-input" type="password" id="chg-new2"></div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeChangePw()">İptal</button>
        <button class="btn-save" onclick="doChangePw()">Değiştir</button>
      </div>
    </div>
  </div>
</div>

<script>
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const now=new Date();
let viewYear=now.getFullYear(),viewMonth=now.getMonth(),selectedDate=null;
const todayStr=isoDate(now);

function isoDate(d){return d.toISOString().split('T')[0]}
function getEvents(){return JSON.parse(localStorage.getItem('tkv_ev')||'[]')}
function saveEvents(e){localStorage.setItem('tkv_ev',JSON.stringify(e))}
function getHash(){return localStorage.getItem('tkv_pw')||''}
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return h.toString(36)}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>{s.style.display='none';s.classList.remove('active')});
  const t=document.getElementById(id);t.style.display='flex';t.classList.add('active');
}

function init(){
  if(!getHash()){show('screen-setup')}
  else{show('screen-lock');setTimeout(()=>document.getElementById('lock-pw').focus(),100)}
}

function doSetup(){
  const p1=document.getElementById('setup-pw').value;
  const p2=document.getElementById('setup-pw2').value;
  const err=document.getElementById('setup-err');
  if(p1.length<4){err.textContent='En az 4 karakter olmalı';return}
  if(p1!==p2){err.textContent='Şifreler eşleşmiyor';return}
  localStorage.setItem('tkv_pw',hash(p1));
  err.textContent='';show('screen-app');render();
}

function doUnlock(){
  const pw=document.getElementById('lock-pw').value;
  const err=document.getElementById('lock-err');
  if(hash(pw)===getHash()){
    err.textContent='';document.getElementById('lock-pw').value='';
    show('screen-app');render();
  }else{
    err.textContent='Hatalı şifre, tekrar dene.';
    document.getElementById('lock-pw').select();
  }
}

function lockApp(){show('screen-lock');setTimeout(()=>document.getElementById('lock-pw').focus(),100)}

function resetAll(){
  if(confirm('Şifreni sıfırlarsan TÜM planların silinecek. Emin misin?')){
    localStorage.clear();location.reload();
  }
}

function openChangePw(){document.getElementById('chg-modal').style.display='flex';document.getElementById('chg-err').textContent=''}
function closeChangePw(){
  document.getElementById('chg-modal').style.display='none';
  ['chg-old','chg-new','chg-new2'].forEach(id=>document.getElementById(id).value='');
}
function doChangePw(){
  const old=document.getElementById('chg-old').value;
  const n1=document.getElementById('chg-new').value;
  const n2=document.getElementById('chg-new2').value;
  const err=document.getElementById('chg-err');
  if(hash(old)!==getHash()){err.textContent='Mevcut şifre yanlış';return}
  if(n1.length<4){err.textContent='Yeni şifre en az 4 karakter olmalı';return}
  if(n1!==n2){err.textContent='Yeni şifreler eşleşmiyor';return}
  localStorage.setItem('tkv_pw',hash(n1));
  closeChangePw();alert('Şifren başarıyla değiştirildi!');
}

function changeMonth(d){
  viewMonth+=d;
  if(viewMonth>11){viewMonth=0;viewYear++}
  if(viewMonth<0){viewMonth=11;viewYear--}
  render();
}
function goToday(){viewYear=now.getFullYear();viewMonth=now.getMonth();render()}

function render(){
  document.getElementById('month-label').textContent=MONTHS[viewMonth]+' '+viewYear;
  const grid=document.getElementById('cal-grid');grid.innerHTML='';
  const events=getEvents();
  const first=new Date(viewYear,viewMonth,1);
  let startDow=first.getDay();startDow=startDow===0?6:startDow-1;
  const dim=new Date(viewYear,viewMonth+1,0).getDate();
  const pd=new Date(viewYear,viewMonth,0).getDate();
  let cells=[];
  for(let i=startDow-1;i>=0;i--)cells.push({date:new Date(viewYear,viewMonth-1,pd-i),cur:false});
  for(let i=1;i<=dim;i++)cells.push({date:new Date(viewYear,viewMonth,i),cur:true});
  while(cells.length<42){const l=cells[cells.length-1].date;cells.push({date:new Date(l.getFullYear(),l.getMonth(),l.getDate()+1),cur:false})}
  cells.forEach(({date,cur})=>{
    const ds=isoDate(date),dayEvs=events.filter(e=>e.date===ds);
    const div=document.createElement('div');
    div.className='cal-day'+(cur?'':' other-month')+(ds===todayStr?' today':'')+(selectedDate===ds?' selected':'');
    const n=document.createElement('div');n.className='day-num';n.textContent=date.getDate();div.appendChild(n);
    dayEvs.slice(0,3).forEach(ev=>{
      const dot=document.createElement('div');
      dot.className='ev-dot '+(ev.type==='urgent'?'urgent':ev.type==='todo'?'todo':'')+(ev.done?' done':'');
      dot.textContent=ev.title;div.appendChild(dot);
    });
    if(dayEvs.length>3){
      const m=document.createElement('div');
      m.style.cssText='font-size:10px;color:var(--text3);padding-left:5px;margin-top:1px';
      m.textContent='+'+( dayEvs.length-3)+' daha';div.appendChild(m);
    }
    div.onclick=()=>selectDay(ds);
    grid.appendChild(div);
  });
  if(selectedDate)renderPanel(selectedDate);
}

function selectDay(ds){
  selectedDate=ds;render();
  const d=new Date(ds+'T12:00:00');
  document.getElementById('panel-date').textContent=d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();
  const n=getEvents().filter(e=>e.date===ds).length;
  document.getElementById('panel-sub').textContent=n?n+' plan var':'Plan yok';
  renderPanel(ds);
}

function renderPanel(ds){
  const list=document.getElementById('events-list');
  const dayEvs=getEvents().filter(e=>e.date===ds);
  if(!dayEvs.length){
    list.innerHTML='<div class="empty-state"><div class="empty-icon"><i class="ti ti-calendar-plus"></i></div>Bu gün için henüz<br>bir plan yok</div>';
    return;
  }
  list.innerHTML='';
  dayEvs.forEach(ev=>{
    const idx=getEvents().findIndex(e=>e.id===ev.id);
    const card=document.createElement('div');
    card.className='ev-card'+(ev.done?' done-card':'');
    const bc=ev.type==='urgent'?'badge-urgent':ev.type==='todo'?'badge-todo':'badge-plan';
    const bt=ev.type==='urgent'?'Acil':ev.type==='todo'?'Yapılacak':'Plan';
    card.innerHTML=`
      <div class="ec-top">
        <div class="ec-title${ev.done?' done-txt':''}">${ev.title}</div>
        <span class="ec-badge ${bc}">${bt}</span>
      </div>
      ${ev.time?`<div class="ec-time"><i class="ti ti-clock" style="font-size:11px;vertical-align:-1px;margin-right:3px"></i>${ev.time}</div>`:''}
      ${ev.desc?`<div class="ec-desc">${ev.desc}</div>`:''}
      <div class="ec-actions">
        <button class="ec-btn ok-btn" onclick="toggleDone(${idx})">${ev.done?'↩ Geri al':'✓ Tamam'}</button>
        <button class="ec-btn del-btn" onclick="deleteEv(${idx})"><i class="ti ti-trash" style="font-size:11px"></i> Sil</button>
      </div>`;
    list.appendChild(card);
  });
}

function toggleDone(i){const e=getEvents();e[i].done=!e[i].done;saveEvents(e);if(selectedDate)selectDay(selectedDate)}
function deleteEv(i){
  if(confirm('Bu planı silmek istediğine emin misin?')){
    const e=getEvents();e.splice(i,1);saveEvents(e);
    if(selectedDate)selectDay(selectedDate);
  }
}

function openModal(ds){
  ['f-title','f-desc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-time').value='';
  document.getElementById('f-type').value='plan';
  document.getElementById('f-date').value=ds||(selectedDate||todayStr);
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>document.getElementById('f-title').focus(),50);
}
function openModalForSelected(){openModal(selectedDate||todayStr)}
function closeModal(){document.getElementById('modal').style.display='none'}

function saveEvent(){
  const title=document.getElementById('f-title').value.trim();
  const date=document.getElementById('f-date').value;
  if(!title||!date){alert('Başlık ve tarih zorunlu!');return}
  const events=getEvents();
  events.push({
    title,date,
    time:document.getElementById('f-time').value,
    type:document.getElementById('f-type').value,
    desc:document.getElementById('f-desc').value.trim(),
    done:false,id:Date.now()
  });
  saveEvents(events);closeModal();
  viewYear=parseInt(date.split('-')[0]);
  viewMonth=parseInt(date.split('-')[1])-1;
  selectDay(date);render();
}

document.getElementById('lock-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doUnlock()});
document.getElementById('setup-pw2').addEventListener('keydown',e=>{if(e.key==='Enter')doSetup()});
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.getElementById('chg-modal').addEventListener('click',function(e){if(e.target===this)closeChangePw()});

init();
</script>
</body>
</html>
